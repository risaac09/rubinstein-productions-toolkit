# Witness mode
# For Founder Story, Bilingual Dashboard interviews, anything where the
# speaker is metabolizing in real time.
#
# Default to non-destructive. Markers visualize the heat-map of nervous
# system processing. The editor uses them to find emotional pivots, not
# to cut filler.
#
# This mode is the structural fix for the central methodological problem:
# BadWords default behavior strips the very signal Say Why work is built on.

mode: witness
description: Mark, do not cut. Heat-map for emotional pivots. Texture preserved.

# === BadWords settings.json mapping ===
badwords_settings:

  # --- Cut/Mark behavior (Fast Silence flow) ---
  # Mark only. Never cut directly.
  fs_cut_mode: false
  fs_mark_mode: true

  # --- Filler word list ---
  # Almost empty by design. We do NOT want BadWords auto-painting red on
  # fillers, because in Witness mode the fillers are data.
  # If the editor wants to surface filler density for review, use selective.yaml
  # instead. Witness keeps the AI out of the methodological decision.
  filler_words: []

  # --- Silence detection ---
  # Generous. Long pauses are signal, not bug.
  # Only mark silences > 2 seconds, so the editor can find true gaps
  # without flagging breath/pause.
  silence_min_dur: 2.0           # default 0.2; 10x more permissive
  silence_threshold_db: -50.0    # default -42; even quieter must register
  ui_spin_pad: 0.5               # generous padding; never clip a tail

  # --- Whisper transcription ---
  # GOLDEN verbatim. Stutters, withdrawals, broken words captured as-is.
  # This matches the saywhy-app transcription rule already in rp-shared/worker.
  ai_initial_prompt: "Umm, yyy, eh, mmm, tsk, h-h-hello, i... i will check. I went... I went to the st... store, tak tak."
  ai_suppress_silence: false     # preserve silence in transcript
  ai_vad_filter: false           # let everything through, including breath
  ai_ultra_precise: true
  ai_beam_size: 5
  ai_temperature: 0.0
  ai_condition_on_prev: false    # each chunk fresh; don't smooth across

  # --- Algorithm tuning ---
  # Higher fuzzy threshold = stricter matching = fewer false marks.
  algo_fuzzy_threshold: 90       # default 75; much stricter
  algo_retake_lookahead: 40      # default 80; less aggressive retake hunting
  algo_distance_penalty: 4.0     # default 2.0; penalize distant matches harder

  # --- Output ---
  xml_preserve_track_order: true   # keep original audio routing intact
  timestamp_precise: true          # ms precision; we may export transcript for codebook

# === Editor instructions ===
# Workflow for Witness mode:
#   1. Open BadWords in Resolve, load this config.
#   2. Transcribe with GOLDEN verbatim prompt. Ums and false starts come through.
#   3. BadWords places markers on silences > 2s, but does NOT paint filler red.
#   4. DO NOT click Assemble unless you want a marker-only timeline.
#      In Witness mode the deliverable is usually the marked-up timeline itself,
#      not an assembled cut.
#   5. Read the timeline like a map. The markers point to emotional pivots.
#
# Pairs with the nomadic-indicators-coder skill for codebook application.
#
# Service tier alignment:
#   - Founder Story (every session)
#   - Bilingual Dashboard interviews (both sides)
#   - Organizational Embedding stakeholder interviews
#   - Any session that will be coded against the RP Measurement Framework
#
# Do NOT use for:
#   - Polished deliverables to third parties (use polish.yaml)
#   - Social cuts (use polish.yaml)
