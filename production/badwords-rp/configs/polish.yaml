# Polish mode
# For Program Engagement deliverables, social cuts, corporate testimonials.
# BadWords cuts filler directly. Tight, performance-grade timeline.
#
# Use when the client wants a clean speaking voice and the texture isn't
# the data. Default for explainer videos, sizzle reels, and most third-party
# distribution.

mode: polish
description: Cut filler. Performance-grade timeline. Default BadWords behavior.

# === BadWords settings.json mapping ===
badwords_settings:

  # --- Cut/Mark behavior (Fast Silence flow) ---
  # Mutually exclusive. Polish cuts directly.
  fs_cut_mode: true
  fs_mark_mode: false

  # --- Filler word list (the words BadWords flags as red/cut) ---
  # Broad list. English-first since most RP work is English.
  # BadWords matches these fuzzily via algo_fuzzy_threshold below.
  filler_words:
    - um
    - umm
    - uh
    - uhh
    - ah
    - ahh
    - er
    - mhm
    - hmm
    - like
    - you know
    - i mean
    - sort of
    - kind of
    - basically
    - literally
    - actually
    - so yeah
    - right
    - okay so

  # --- Silence detection ---
  # Tight. Cut anything over a quarter second.
  silence_min_dur: 0.18          # default 0.2; tighter for polish
  silence_threshold_db: -42.0    # default; sensitive enough for most rooms
  ui_spin_pad: 0.05              # 50ms padding around cuts; less than default

  # --- Whisper transcription ---
  # Use the clean prompt, not the GOLDEN verbatim prompt.
  # We don't need stutters preserved if we're cutting them anyway.
  ai_initial_prompt: ""          # empty = Whisper's natural smoothing
  ai_suppress_silence: true
  ai_vad_filter: true            # Voice Activity Detection on
  ai_ultra_precise: true
  ai_beam_size: 5                # more thorough beam search
  ai_temperature: 0.0

  # --- Algorithm tuning ---
  algo_fuzzy_threshold: 75       # default; balanced false-positive risk
  algo_retake_lookahead: 80      # default
  algo_distance_penalty: 2.0

  # --- Output ---
  xml_preserve_track_order: false  # re-map A1..An; downstream tools expect this
  timestamp_precise: false

# === Editor instructions ===
# Workflow for Polish mode:
#   1. Open BadWords in Resolve, load this config (see README).
#   2. Transcribe. BadWords auto-paints red on filler_words above.
#   3. Review the red sweep. Manually add red to anything BadWords missed.
#   4. Click Assemble. New timeline ships with cuts applied.
#
# Service tier alignment:
#   - Program Engagement social cuts
#   - Corporate testimonial polish
#   - Explainer and sizzle work
#
# Do NOT use for:
#   - Founder Story interviews (use witness.yaml)
#   - Anything where the speaker's nervous system processing is the content
