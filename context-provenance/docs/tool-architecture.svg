<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Context Provenance — Tool Architecture</title>
  <desc>System architecture: conversation transcript flows through analyzer into four-channel classification, producing JSON and HTML outputs</desc>

  <defs>
    <pattern id="hatch-arch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#3d3530" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-bone" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#a89e93"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#c8923a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" fill="#1a1412"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="20" fill="#f2ece4">Tool Architecture</text>
  <line x1="350" y1="50" x2="550" y2="50" stroke="#c8923a" stroke-width="0.8"/>
  <text x="450" y="68" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93" letter-spacing="1.5px">CONTEXT-PROVENANCE · APPLICATION-LAYER ATTRIBUTION</text>

  <!-- ═══════ INPUT ═══════ -->
  <text x="110" y="108" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56" letter-spacing="1.5px">INPUT</text>

  <!-- Transcript box -->
  <rect x="30" y="118" width="160" height="70" fill="none" stroke="#a89e93" stroke-width="0.8"/>
  <text x="110" y="140" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="13" fill="#f2ece4">Conversation</text>
  <text x="110" y="155" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="13" fill="#f2ece4">Transcript</text>
  <text x="110" y="175" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56">.jsonl · tool calls · messages</text>

  <!-- Arrow: input → analyzer -->
  <line x1="190" y1="153" x2="270" y2="153" stroke="#a89e93" stroke-width="0.8" marker-end="url(#arr-bone)"/>

  <!-- ═══════ ANALYZER ═══════ -->
  <text x="390" y="98" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#c8923a" letter-spacing="1.5px">ANALYZER</text>

  <rect x="280" y="108" width="220" height="90" fill="none" stroke="#c8923a" stroke-width="1"/>

  <text x="390" y="132" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="14" fill="#f2ece4">Transcript Analyzer</text>
  <line x1="310" y1="140" x2="470" y2="140" stroke="#3d3530" stroke-width="0.5"/>

  <text x="300" y="158" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93">Parse tool calls</text>
  <text x="300" y="172" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93">Detect file reads, skill loads</text>
  <text x="300" y="186" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93">Classify → Channels 1–3</text>

  <!-- ═══════ CHANNEL CLASSIFICATION ═══════ -->
  <text x="450" y="230" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56" letter-spacing="1.5px">FOUR-CHANNEL CLASSIFICATION</text>

  <!-- Vertical lines from analyzer -->
  <line x1="320" y1="198" x2="320" y2="248" stroke="#6b5f56" stroke-width="0.5"/>
  <line x1="370" y1="198" x2="370" y2="248" stroke="#6b5f56" stroke-width="0.5"/>
  <line x1="420" y1="198" x2="420" y2="248" stroke="#6b5f56" stroke-width="0.5"/>
  <line x1="470" y1="198" x2="470" y2="248" stroke="#6b5f56" stroke-width="0.5"/>

  <!-- Channel 1 box -->
  <rect x="40" y="248" width="186" height="115" fill="none" stroke="#c8923a" stroke-width="0.8"/>
  <rect x="40" y="248" width="2" height="115" fill="#c8923a"/>
  <text x="55" y="266" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="7" fill="#c8923a" letter-spacing="1.2px" font-weight="600">CH 1 · SKILL INSTRUCTIONS</text>
  <line x1="55" y1="272" x2="210" y2="272" stroke="#3d3530" stroke-width="0.3"/>
  <text x="55" y="288" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93">Detect: skill load patterns</text>
  <text x="55" y="302" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93">system_prompt reads</text>
  <text x="55" y="316" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93">SKILL.md references</text>
  <rect x="55" y="335" width="68" height="16" fill="none" stroke="#c8923a" stroke-width="0.4"/>
  <text x="89" y="347" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="7" fill="#c8923a" letter-spacing="0.8px">RETRIEVABLE</text>

  <!-- Channel 2 box -->
  <rect x="246" y="248" width="186" height="115" fill="none" stroke="#8b2e1c" stroke-width="0.8"/>
  <rect x="246" y="248" width="2" height="115" fill="#8b2e1c"/>
  <text x="261" y="266" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="7" fill="#8b2e1c" letter-spacing="1.2px" font-weight="600">CH 2 · RETRIEVED CONTEXT</text>
  <line x1="261" y1="272" x2="416" y2="272" stroke="#3d3530" stroke-width="0.3"/>
  <text x="261" y="288" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93">Detect: Read tool calls</text>
  <text x="261" y="302" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93">WebSearch, WebFetch</text>
  <text x="261" y="316" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93">API / MCP tool results</text>
  <rect x="261" y="335" width="68" height="16" fill="none" stroke="#8b2e1c" stroke-width="0.4"/>
  <text x="295" y="347" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="7" fill="#8b2e1c" letter-spacing="0.8px">RETRIEVABLE</text>

  <!-- Channel 3 box -->
  <rect x="452" y="248" width="186" height="115" fill="none" stroke="#c8923a" stroke-width="0.8" stroke-dasharray="4 2"/>
  <rect x="452" y="248" width="2" height="115" fill="#c8923a"/>
  <text x="467" y="266" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="7" fill="#c8923a" letter-spacing="1.2px" font-weight="600">CH 3 · CONVERSATION MEMORY</text>
  <line x1="467" y1="272" x2="622" y2="272" stroke="#3d3530" stroke-width="0.3"/>
  <text x="467" y="288" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93">Detect: memory reads</text>
  <text x="467" y="302" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93">prior session references</text>
  <text x="467" y="316" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93">human relational context</text>
  <rect x="467" y="335" width="108" height="16" fill="none" stroke="#c8923a" stroke-width="0.4" stroke-dasharray="3 1"/>
  <text x="521" y="347" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="7" fill="#c8923a" letter-spacing="0.8px">PARTIALLY RETRIEVABLE</text>

  <!-- Channel 4 box -->
  <rect x="658" y="248" width="200" height="115" fill="url(#hatch-arch)" stroke="#6b5f56" stroke-width="0.8" stroke-dasharray="5 3"/>
  <rect x="658" y="248" width="2" height="115" fill="#6b5f56"/>
  <text x="673" y="266" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="7" fill="#6b5f56" letter-spacing="1.2px" font-weight="600">CH 4 · TRAINING INTERPOLATION</text>
  <line x1="673" y1="272" x2="842" y2="272" stroke="#3d3530" stroke-width="0.3"/>
  <text x="673" y="288" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#6b5f56">Added automatically</text>
  <text x="673" y="302" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#6b5f56">Cannot be detected</text>
  <text x="673" y="316" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#6b5f56">Always present</text>
  <rect x="673" y="335" width="100" height="16" fill="none" stroke="#8b2e1c" stroke-width="0.4"/>
  <text x="723" y="347" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="7" fill="#8b2e1c" letter-spacing="0.8px">NOT RETRIEVABLE</text>

  <!-- Horizontal connector from analyzer to all channels -->
  <line x1="280" y1="248" x2="858" y2="248" stroke="#3d3530" stroke-width="0.5"/>

  <!-- ═══════ OUTPUT ═══════ -->
  <!-- Merge lines -->
  <line x1="133" y1="363" x2="133" y2="420" stroke="#6b5f56" stroke-width="0.5"/>
  <line x1="339" y1="363" x2="339" y2="420" stroke="#6b5f56" stroke-width="0.5"/>
  <line x1="545" y1="363" x2="545" y2="420" stroke="#6b5f56" stroke-width="0.5"/>
  <line x1="758" y1="363" x2="758" y2="420" stroke="#6b5f56" stroke-width="0.5"/>
  <line x1="133" y1="420" x2="758" y2="420" stroke="#6b5f56" stroke-width="0.5"/>
  <line x1="450" y1="420" x2="450" y2="445" stroke="#c8923a" stroke-width="0.8" marker-end="url(#arr-amber)"/>

  <text x="450" y="440" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56" letter-spacing="1.5px">OUTPUT</text>

  <!-- ProvenanceRecord box -->
  <rect x="270" y="453" width="360" height="40" fill="none" stroke="#c8923a" stroke-width="1"/>
  <text x="450" y="476" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="14" fill="#f2ece4">ProvenanceRecord</text>
  <text x="450" y="488" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56">title · author · model · created · sources[] · opacity_ratio</text>

  <!-- Fork to JSON and HTML -->
  <line x1="380" y1="493" x2="280" y2="520" stroke="#a89e93" stroke-width="0.5" marker-end="url(#arr-bone)"/>
  <line x1="520" y1="493" x2="620" y2="520" stroke="#a89e93" stroke-width="0.5" marker-end="url(#arr-bone)"/>

  <!-- JSON output -->
  <rect x="170" y="525" width="160" height="36" fill="none" stroke="#a89e93" stroke-width="0.5"/>
  <text x="250" y="546" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="11" fill="#a89e93">provenance.json</text>
  <text x="250" y="557" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56">structured data · embeddable</text>

  <!-- HTML output -->
  <rect x="570" y="525" width="160" height="36" fill="none" stroke="#a89e93" stroke-width="0.5"/>
  <text x="650" y="546" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="11" fill="#a89e93">provenance.html</text>
  <text x="650" y="557" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56">swim-lane diagram · embedded JSON</text>

  <!-- Manual entry path (top right) -->
  <text x="730" y="108" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56" letter-spacing="1.5px">ALTERNATIVE INPUT</text>
  <rect x="640" y="118" width="180" height="55" fill="none" stroke="#6b5f56" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text x="730" y="140" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="13" fill="#a89e93">Manual Entry</text>
  <text x="730" y="158" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56">Interactive CLI · per-channel prompts</text>
  <text x="730" y="170" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56">for text produced before this tool existed</text>

  <line x1="640" y1="153" x2="500" y2="153" stroke="#6b5f56" stroke-width="0.5" stroke-dasharray="3 2" marker-end="url(#arr-bone)"/>
</svg>