<svg viewBox="0 0 900 920" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Provenance Storyboard: Side by Side (on Lanier at Brown)</title>
  <desc>How each source contributed to the essay across four channels, from event through publication</desc>

  <defs>
    <pattern id="hatch-sb" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#3d3530" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#6b5f56"/>
    </marker>
    <marker id="arrow-amber" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#c8923a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="920" fill="#1a1412"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="20" fill="#f2ece4">"Side by Side" — What Shaped the Essay</text>
  <line x1="310" y1="52" x2="590" y2="52" stroke="#c8923a" stroke-width="0.8"/>
  <text x="450" y="70" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#a89e93" letter-spacing="1.5px">PROVENANCE STORYBOARD · 18 SOURCES · 4 CHANNELS</text>

  <!-- Central timeline -->
  <line x1="450" y1="90" x2="450" y2="830" stroke="#3d3530" stroke-width="1"/>

  <!-- ═══════ PHASE 1: The Event ═══════ -->
  <circle cx="450" cy="105" r="4" fill="#c8923a"/>
  <text x="470" y="109" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#c8923a" letter-spacing="1px" font-weight="600">APRIL 22 — THE EVENT</text>

  <!-- CH3: Relational context (left) -->
  <rect x="40" y="125" width="360" height="80" fill="none" stroke="#c8923a" stroke-width="0.8" stroke-dasharray="4 2"/>
  <rect x="40" y="125" width="2" height="80" fill="#c8923a"/>
  <text x="56" y="142" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#c8923a" letter-spacing="1.5px" font-weight="600">CH 3 — RELATIONAL CONTEXT</text>
  <text x="56" y="158" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">6 months of Arena research (Bergson, Deleuze, Gibson)</text>
  <text x="56" y="173" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">Book club with Paul — Bergsonism, long runs, Brown campus</text>
  <text x="56" y="192" font-family="'EB Garamond', 'Georgia', serif" font-size="10" fill="#6b5f56" font-style="italic">Isaac arrived with a framework. The event landed inside it.</text>

  <!-- CH2: Captured at event (right) -->
  <rect x="500" y="125" width="360" height="80" fill="none" stroke="#8b2e1c" stroke-width="0.8"/>
  <rect x="500" y="125" width="2" height="80" fill="#8b2e1c"/>
  <text x="516" y="142" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#8b2e1c" letter-spacing="1.5px" font-weight="600">CH 2 — CAPTURED AT THE EVENT</text>
  <text x="516" y="158" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">Isaac's video recording (camera, viewfinder, double mirror)</text>
  <text x="516" y="173" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">Automated captions — speech-to-text, model unknown</text>
  <text x="516" y="192" font-family="'EB Garamond', 'Georgia', serif" font-size="10" fill="#6b5f56" font-style="italic">5 speakers. Lanier. Music. The scaffold of debts.</text>

  <!-- Connectors to phase 2 -->
  <line x1="220" y1="205" x2="445" y2="240" stroke="#6b5f56" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="205" x2="455" y2="240" stroke="#6b5f56" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- ═══════ PHASE 2: Caption Cleaning ═══════ -->
  <circle cx="450" cy="250" r="4" fill="#8b2e1c"/>
  <text x="470" y="254" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#8b2e1c" letter-spacing="1px" font-weight="600">CAPTION CLEANING — CLAUDE ENTERS</text>

  <!-- CH4: Training data (left) -->
  <rect x="80" y="270" width="320" height="75" fill="url(#hatch-sb)" stroke="#6b5f56" stroke-width="0.8" stroke-dasharray="5 3"/>
  <rect x="80" y="270" width="2" height="75" fill="#6b5f56"/>
  <text x="96" y="287" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56" letter-spacing="1.5px" font-weight="600">CH 4 — TRAINING DATA (OPAQUE)</text>
  <text x="96" y="305" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#6b5f56">Claude's weights include Lanier's prior essays</text>
  <text x="96" y="320" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#6b5f56">His prior voice interpolated back into his current words</text>
  <text x="96" y="336" font-family="'EB Garamond', 'Georgia', serif" font-size="9" fill="#4a433d" font-style="italic">The model already knew him before it heard him.</text>

  <!-- CH2: Corrections (right) -->
  <rect x="500" y="270" width="320" height="75" fill="none" stroke="#8b2e1c" stroke-width="0.8"/>
  <rect x="500" y="270" width="2" height="75" fill="#8b2e1c"/>
  <text x="516" y="287" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#8b2e1c" letter-spacing="1.5px" font-weight="600">CH 2 — CORRECTIONS</text>
  <text x="516" y="305" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">"Jaren" → "Jaron" · "Entropic" → "Anthropic"</text>
  <text x="516" y="320" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">"Jesus Anunda" → [percussionist name unresolved]</text>
  <text x="516" y="336" font-family="'EB Garamond', 'Georgia', serif" font-size="9" fill="#6b5f56" font-style="italic">Channel 4 corrected Channels 2 and 3 simultaneously.</text>

  <!-- Connectors to phase 3 -->
  <line x1="240" y1="345" x2="445" y2="385" stroke="#6b5f56" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="345" x2="455" y2="385" stroke="#6b5f56" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- ═══════ PHASE 3: Drafting ═══════ -->
  <circle cx="450" cy="395" r="4" fill="#c8923a"/>
  <text x="470" y="399" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#c8923a" letter-spacing="1px" font-weight="600">DRAFTING — FIVE VERSIONS</text>

  <!-- CH1: Skills (left) -->
  <rect x="40" y="415" width="250" height="100" fill="none" stroke="#c8923a" stroke-width="0.8"/>
  <rect x="40" y="415" width="2" height="100" fill="#c8923a"/>
  <text x="56" y="432" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#c8923a" letter-spacing="1.5px" font-weight="600">CH 1 — SKILLS LOADED</text>
  <text x="56" y="452" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">isaac-voice</text>
  <text x="56" y="466" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#6b5f56">30+ source texts, 50-point scoring rubric</text>
  <text x="56" y="484" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">stop-slop</text>
  <text x="56" y="498" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#6b5f56">AI pattern removal, active across all 5 drafts</text>

  <!-- CH4: Absorbed patterns (center) -->
  <rect x="310" y="415" width="250" height="100" fill="url(#hatch-sb)" stroke="#6b5f56" stroke-width="0.8" stroke-dasharray="5 3"/>
  <rect x="310" y="415" width="2" height="100" fill="#6b5f56"/>
  <text x="326" y="432" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56" letter-spacing="1.5px" font-weight="600">CH 4 — ABSORBED PATTERNS</text>
  <text x="326" y="452" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#6b5f56">Deleuze / Bergson scholarly corpus</text>
  <text x="326" y="466" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#6b5f56">Gibson / ecological psychology</text>
  <text x="326" y="480" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#6b5f56">Essay writing conventions</text>
  <text x="326" y="500" font-family="'EB Garamond', 'Georgia', serif" font-size="9" fill="#4a433d" font-style="italic">Cannot separate from Isaac's reading</text>

  <!-- CH3: Session memory (right) -->
  <rect x="580" y="415" width="280" height="100" fill="none" stroke="#c8923a" stroke-width="0.8" stroke-dasharray="4 2"/>
  <rect x="580" y="415" width="2" height="100" fill="#c8923a"/>
  <text x="596" y="432" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#c8923a" letter-spacing="1.5px" font-weight="600">CH 3 — SESSION MEMORY</text>
  <text x="596" y="452" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">"Jaron Lanier at Brown" session</text>
  <text x="596" y="466" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">"Convert to Substack draft" session</text>
  <text x="596" y="480" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">Auto-memory: voice preferences</text>
  <text x="596" y="500" font-family="'EB Garamond', 'Georgia', serif" font-size="9" fill="#6b5f56" font-style="italic">Revision history across 5 drafts</text>

  <!-- Connectors to publication -->
  <line x1="165" y1="515" x2="445" y2="555" stroke="#6b5f56" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="435" y1="515" x2="448" y2="555" stroke="#6b5f56" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="515" x2="455" y2="555" stroke="#6b5f56" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- ═══════ PHASE 4: Publication ═══════ -->
  <circle cx="450" cy="565" r="4" fill="#f2ece4"/>
  <text x="470" y="569" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#f2ece4" letter-spacing="1px" font-weight="600">PUBLICATION</text>

  <!-- Essay output box -->
  <rect x="180" y="585" width="540" height="60" fill="none" stroke="#f2ece4" stroke-width="1.5"/>
  <text x="450" y="608" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="16" fill="#f2ece4">"Side by Side (on Lanier at Brown)"</text>
  <text x="450" y="626" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">Isaac Rubinstein · April 2026</text>
  <text x="450" y="639" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="9" fill="#6b5f56" font-style="italic">The essay's chain of custody section already does this work in prose.</text>

  <!-- Arrow to provenance record -->
  <line x1="450" y1="645" x2="450" y2="678" stroke="#c8923a" stroke-width="0.8" marker-end="url(#arrow-amber)"/>

  <!-- ═══════ Provenance Record ═══════ -->
  <rect x="140" y="685" width="620" height="100" fill="none" stroke="#c8923a" stroke-width="1"/>
  <text x="450" y="708" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#c8923a" letter-spacing="1.5px" font-weight="600">CONTEXT-PROVENANCE RECORD</text>

  <!-- Stat boxes -->
  <rect x="185" y="720" width="120" height="48" fill="none" stroke="#c8923a" stroke-width="0.5"/>
  <text x="245" y="748" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="24" fill="#c8923a">18</text>
  <text x="245" y="762" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#a89e93" letter-spacing="0.5px">total sources</text>

  <rect x="340" y="720" width="120" height="48" fill="none" stroke="#8b2e1c" stroke-width="0.5"/>
  <text x="400" y="748" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="24" fill="#8b2e1c">11</text>
  <text x="400" y="762" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#a89e93" letter-spacing="0.5px">retrievable</text>

  <rect x="495" y="720" width="120" height="48" fill="url(#hatch-sb)" stroke="#6b5f56" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text x="555" y="748" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="24" fill="#6b5f56">38%</text>
  <text x="555" y="762" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#6b5f56" letter-spacing="0.5px">opacity</text>

  <!-- Footer -->
  <line x1="250" y1="820" x2="650" y2="820" stroke="#3d3530" stroke-width="0.5"/>
  <text x="450" y="840" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="11" fill="#6b5f56" font-style="italic">The same move in structured data: make the sourcing visible,</text>
  <text x="450" y="855" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="11" fill="#6b5f56" font-style="italic">mark the gap, let the reader assess what they are reading.</text>

  <!-- Channel legend -->
  <rect x="260" y="875" width="8" height="8" fill="none" stroke="#c8923a" stroke-width="1"/>
  <text x="275" y="883" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#a89e93">Skill</text>
  <rect x="330" y="875" width="8" height="8" fill="none" stroke="#8b2e1c" stroke-width="1"/>
  <text x="345" y="883" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#a89e93">Retrieved</text>
  <rect x="410" y="875" width="8" height="8" fill="none" stroke="#c8923a" stroke-width="1" stroke-dasharray="2 1"/>
  <text x="425" y="883" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#a89e93">Memory</text>
  <rect x="490" y="875" width="8" height="8" fill="url(#hatch-sb)" stroke="#6b5f56" stroke-width="1" stroke-dasharray="2 1"/>
  <text x="505" y="883" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#a89e93">Training (opaque)</text>
</svg>