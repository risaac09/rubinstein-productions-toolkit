<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Four-Channel Context Provenance Model</title>
  <desc>Four parallel channels of attribution for AI-mediated text. Three open. One does not.</desc>

  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#3d3530" stroke-width="0.8"/>
    </pattern>
    <clipPath id="ch4clip">
      <rect x="48" y="430" width="704" height="120" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" fill="#1a1412"/>

  <!-- Title block -->
  <text x="400" y="52" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="22" font-weight="400" fill="#f2ece4" letter-spacing="0.5px">Context Provenance</text>
  <line x1="320" y1="62" x2="480" y2="62" stroke="#c8923a" stroke-width="0.8"/>
  <text x="400" y="82" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93" letter-spacing="1.5px" text-transform="uppercase">FOUR-CHANNEL ATTRIBUTION MODEL</text>

  <!-- Channel 1 — Skill Instructions -->
  <rect x="48" y="110" width="704" height="70" fill="none" stroke="#c8923a" stroke-width="1"/>
  <rect x="48" y="110" width="3" height="70" fill="#c8923a"/>

  <text x="72" y="132" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#c8923a" letter-spacing="2px" font-weight="600">CHANNEL 1</text>
  <text x="160" y="132" font-family="'EB Garamond', 'Georgia', serif" font-size="15" fill="#f2ece4" font-weight="400">Skill Instructions</text>

  <text x="72" y="150" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">System prompts, loaded skills, methodology files.</text>
  <text x="72" y="165" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">The operational DNA. You wrote it or you loaded it.</text>

  <rect x="640" y="125" width="96" height="22" fill="none" stroke="#c8923a" stroke-width="0.5"/>
  <text x="688" y="140" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#c8923a" letter-spacing="1px">RETRIEVABLE</text>

  <!-- Channel 2 — Retrieved Context -->
  <rect x="48" y="200" width="704" height="70" fill="none" stroke="#8b2e1c" stroke-width="1"/>
  <rect x="48" y="200" width="3" height="70" fill="#8b2e1c"/>

  <text x="72" y="222" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#8b2e1c" letter-spacing="2px" font-weight="600">CHANNEL 2</text>
  <text x="160" y="222" font-family="'EB Garamond', 'Georgia', serif" font-size="15" fill="#f2ece4" font-weight="400">Retrieved Context</text>

  <text x="72" y="240" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">Files read, tools called, web searches run, APIs queried.</text>
  <text x="72" y="255" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">Citation-grade material with paths and URLs.</text>

  <rect x="640" y="215" width="96" height="22" fill="none" stroke="#8b2e1c" stroke-width="0.5"/>
  <text x="688" y="230" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#8b2e1c" letter-spacing="1px">RETRIEVABLE</text>

  <!-- Channel 3 — Conversation Memory -->
  <rect x="48" y="290" width="704" height="85" fill="none" stroke="#c8923a" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="48" y="290" width="3" height="85" fill="#c8923a"/>

  <text x="72" y="312" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#c8923a" letter-spacing="2px" font-weight="600">CHANNEL 3</text>
  <text x="160" y="312" font-family="'EB Garamond', 'Georgia', serif" font-size="15" fill="#f2ece4" font-weight="400">Conversation Memory</text>

  <text x="72" y="332" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">Prior turns, stored memories from past sessions, relational context.</text>
  <text x="72" y="347" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">Some logged in the system. Some happened between people.</text>
  <text x="72" y="362" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#6b5f56" font-style="italic">The boundary between retrievable and relational is the boundary of the system.</text>

  <rect x="600" y="305" width="136" height="22" fill="none" stroke="#c8923a" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="668" y="320" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#c8923a" letter-spacing="1px">PARTIALLY RETRIEVABLE</text>

  <!-- Channel 4 — Training Interpolation -->
  <rect x="48" y="400" width="704" height="130" fill="url(#hatch)" stroke="#6b5f56" stroke-width="1" stroke-dasharray="6 3"/>
  <rect x="48" y="400" width="3" height="130" fill="#6b5f56"/>

  <text x="72" y="425" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#6b5f56" letter-spacing="2px" font-weight="600">CHANNEL 4</text>
  <text x="160" y="425" font-family="'EB Garamond', 'Georgia', serif" font-size="15" fill="#a89e93" font-weight="400">Training Interpolation</text>

  <text x="72" y="446" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#6b5f56">Language patterns, factual knowledge, reasoning strategies, stylistic tendencies</text>
  <text x="72" y="461" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#6b5f56">absorbed from training data whose specific sources cannot be identified.</text>

  <text x="72" y="486" font-family="'EB Garamond', 'Georgia', serif" font-size="11" fill="#6b5f56" font-style="italic">"The trace remains after the cutting, but the relation was</text>
  <text x="72" y="500" font-family="'EB Garamond', 'Georgia', serif" font-size="11" fill="#6b5f56" font-style="italic"> what the cutting destroyed."</text>

  <rect x="588" y="414" width="148" height="22" fill="none" stroke="#8b2e1c" stroke-width="0.5"/>
  <text x="662" y="429" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="8" fill="#8b2e1c" letter-spacing="1px">NOT RETRIEVABLE</text>
  <text x="662" y="441" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="7" fill="#6b5f56" letter-spacing="0.5px">marking it is the transparency</text>

  <!-- Opacity formula -->
  <line x1="200" y1="558" x2="600" y2="558" stroke="#3d3530" stroke-width="0.5"/>
  <text x="400" y="578" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="10" fill="#a89e93">opacity ratio = non-retrievable sources / total sources</text>
  <text x="400" y="598" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="9" fill="#6b5f56">Worked example: 18 sources · 11 retrievable · 38% opacity</text>

  <!-- Left margin accent line -->
  <line x1="28" y1="110" x2="28" y2="530" stroke="#3d3530" stroke-width="0.5"/>
</svg>