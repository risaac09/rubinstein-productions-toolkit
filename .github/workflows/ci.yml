name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  cli-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CLI smoke test (GNU userland)
        run: scripts/cli-smoke-test.sh
      - name: Vault-mirror drift check
        run: TOOLKIT_ROOT="$GITHUB_WORKSPACE" scripts/check-vault-mirror-drift.sh
      - name: Markdown link check
        run: scripts/check-doc-links.sh
      - name: Unresolved merge marker check
        run: |
          if git grep -n -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- . ':(exclude)*.skill'; then
            echo "Unresolved merge markers found" >&2
            exit 1
          fi
      # The phase-zero kit ships hooks into fourteen repos, and a hook with a
      # syntax error fails closed and silent by design: the trigger exits 0
      # and prints nothing, so a broken deploy looks exactly like a prompt
      # that was not a trigger. Nothing here checked these files at all until
      # 2026-09-20. Syntax first, behavior next.
      - name: Phase-zero shell syntax
        run: |
          set -eu
          n=0
          for f in $(git ls-files 'phase-zero/*.sh' 'phase-zero/**/*.sh'); do
            bash -n "$f" || { echo "syntax error in $f" >&2; exit 1; }
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "no phase-zero shell files matched; the glob is wrong" >&2; exit 1; }
          echo "phase-zero: $n shell file(s) parse clean"
      # bash -n passed on the 2026-09 history purge, which replaced the SRC=
      # line in install.sh and install-global.sh with a marker: the marker
      # parses as a command. shellcheck reports it as an error. Strictest
      # level that passes the current tree, with two exclusions:
      # SC1090, the hooks source their lib from a path found at runtime, by
      # design; SC2015, three notes in the global trigger, a deployed file
      # whose every edit forces a reinstall on each machine.
      - name: Phase-zero shellcheck
        run: |
          set -eu
          shellcheck --version | sed -n 2p
          shellcheck -S style -e SC1090,SC2015 $(git ls-files 'phase-zero/*.sh' 'phase-zero/**/*.sh')
          echo "phase-zero: shellcheck clean"
      # Run the installers for real. A syntax check cannot see a script that
      # parses but dies on its first line (an unset SRC under set -u).
      - name: Phase-zero install and check, for real
        run: |
          set -eu
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@localhost GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@localhost
          n="$(bash phase-zero/install.sh --list | wc -l)"
          [ "$n" -gt 0 ] || { echo "install.sh --list printed nothing" >&2; exit 1; }
          echo "install.sh --list: $n consumer(s)"
          # A target with no origin: install, then check (the committed-state
          # compare is skipped and says why).
          t="$(mktemp -d)"; git -C "$t" init -q
          bash phase-zero/install.sh "$t"
          bash phase-zero/install.sh --check "$t"
          # Give it an origin whose default branch lacks the kit: the
          # committed-state compare must fire.
          o="$(mktemp -d)"; git init -q --bare "$o"
          git -C "$t" remote add origin "$o"
          git -C "$t" commit -q --allow-empty -m init
          git -C "$t" push -q origin HEAD:refs/heads/main
          git -C "$t" fetch -q origin
          git -C "$t" remote set-head origin main
          if out="$(bash phase-zero/install.sh --check "$t")"; then
            echo "$out"; echo "check passed with the kit uncommitted" >&2; exit 1
          fi
          echo "$out" | grep -q '^DRIFT uncommitted: ' || { echo "$out"; echo "no DRIFT uncommitted line" >&2; exit 1; }
          echo "committed-state compare fires on an uncommitted kit"
          # Commit the kit (force-added: .claude/ is often globally ignored)
          # and push it; the check must pass.
          git -C "$t" add -f .claude
          git -C "$t" commit -q -m kit
          git -C "$t" push -q origin HEAD:refs/heads/main
          git -C "$t" fetch -q origin
          bash phase-zero/install.sh --check "$t"
          # The global installer into a throwaway CLAUDE_HOME, then --check.
          ch="$(mktemp -d)"
          CLAUDE_HOME="$ch" bash phase-zero/global/install-global.sh
          CLAUDE_HOME="$ch" bash phase-zero/global/install-global.sh --check
          echo x >> "$ch/hooks/session-brief.sh"
          if CLAUDE_HOME="$ch" bash phase-zero/global/install-global.sh --check; then
            echo "install-global.sh --check passed on a stale hook" >&2; exit 1
          fi
          echo "install-global.sh --check fires on a stale hook"
      # The public-kit roster comes from the private stack-data registry,
      # which CI does not have. Assert only that every roster mode refuses
      # with exit 2 and says why, rather than running on an empty list.
      - name: Public-kit refuses without the registry
        run: |
          set -eu
          export SD_ROOT="$RUNNER_TEMP/no-stack-data"
          p="$(mktemp -d)"
          for mode in "--list" "--check --all $p" "--all $p"; do
            rc=0
            err="$(bash phase-zero/install.sh --public $mode 2>&1 >/dev/null)" || rc=$?
            if [ "$rc" -ne 2 ]; then echo "install.sh --public $mode exited $rc, want 2" >&2; exit 1; fi
            echo "$err" | grep -q 'cannot build the public-kit roster' || { echo "$err"; echo "no clear message for --public $mode" >&2; exit 1; }
            echo "install.sh --public $mode: exit 2 as expected"
          done
      # The 2026-09 history purge left its marker inside two scripts. Fail on
      # any tracked file that still carries one. The patterns are split so
      # this file does not match itself.
      - name: History-purge marker check
        run: |
          m1='REMOVED FROM PUBLIC'' HISTORY'
          m2='***''REMOVED***'
          if git grep -I -n -F -e "$m1" -e "$m2"; then
            echo "history-purge marker found in a tracked file" >&2
            exit 1
          fi
          echo "no history-purge markers"
      # Bundles and office files hide their contents from git grep and the
      # privacy scans. Each tracked one must be listed in .binary-allowlist.
      - name: Binary allowlist
        run: |
          set -eu
          bad=0
          # Read the list once; a grep -q at the end of a pipe under
          # pipefail can fail on SIGPIPE and report a listed file as missing.
          allowed="$(grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' .binary-allowlist || true)"
          while IFS= read -r f; do
            if ! grep -qxF -- "$f" <<<"$allowed"; then
              echo "not in .binary-allowlist: $f" >&2
              bad=1
            fi
          done < <(git ls-files | grep -iE '\.(skill|zip|plugin|docx|xlsx|pptx)$' || true)
          [ "$bad" -eq 0 ] || exit 1
          echo "binary allowlist: clean"

  # The Resolve MCP server core and the library under it are stdlib-only
  # and run on the system Python 3.9 on the Mac; this job runs their tests
  # on 3.9 so a newer-Python construct or a protocol regression fails the PR.
  # Tests that need Resolve, numpy, ffmpeg or macOS skip themselves.
  resolve-mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: MCP protocol, schema, stdio isolation, end to end
        run: python -m unittest -v production.tests.test_mcp
      - name: MCP offline tools
        run: python -m unittest -v production.tests.test_mcp_offline
      - name: MCP read tools
        run: python -m unittest -v production.tests.test_mcp_reads
      - name: MCP write tools, journal, forbidden calls
        run: python -m unittest -v production.tests.test_mcp_writes production.tests.test_mcp_writes2
      - name: Library, workflows and the script's command set
        run: python -m unittest production.tests.test_workflows production.tests.test_rpresolve_lib production.tests.test_resolve_workflow_pure
      - name: Cut, sync and settings drift guard
        run: python -m unittest production.tests.test_cut_reframe production.tests.test_sync_resolve production.tests.test_cutlist production.tests.test_settingsguard
