name: Deploy architecture to Pages

on:
  push:
    branches:
      - claude/agentic-orchestrator-digital-twin-5xot4c
      - main
    paths:
      - architecture/**
      - .github/workflows/deploy-architecture.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: architecture
      - id: deploy
        uses: actions/deploy-pages@v4
